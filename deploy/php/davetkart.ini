; priority=99
; DavetKart PHP uretim ayarlari (fpm + cli). Ayrinti: docs/rehber/deploy/php/davetkart.md
; Kurulum: /etc/php/8.5/mods-available/davetkart.ini + `phpenmod -v 8.5 davetkart`

; Yukleme zinciri: Nginx 30m >= post_max_size >= upload_max_filesize >= uygulama (15 MB foto, 20 MB video)
upload_max_filesize = 25M
post_max_size = 30M
memory_limit = 256M

; Hatalar kullaniciya degil log'a.
display_errors = Off
log_errors = On
expose_php = Off

; CVE-2026-109618/109619 savunma derinligi. Laravel yerel PHP yukleme ilerlemesini kullanmaz.
session.upload_progress.enabled = Off

; OPS-07 (K269): OPcache. validate_timestamps=0 -> kod degisikligi ancak FPM reload ile gorulur;
; deploy.sh bakim kipinde reload yapar (K264). Reload'suz dosya degistirmek ESKI kodu calistirir.
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
