# DavetKart - SPA guvenlik basliklari (SEC-04, K173-K176). Ayrinti: docs/rehber/deploy/nginx/snippets/davetkart-security-headers.md
# Sunucuda: /etc/nginx/snippets/davetkart-security-headers.conf. /api yanitlarina EKLENMEZ: onlari Laravel basar (K85).
# 'add_header' ust bloktan miras alinmaz: kendi add_header'i olan her location bu dosyayi ayrica include eder.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "accelerometer=(self), gyroscope=(self), magnetometer=(), camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)" always;

# Zorlanan kucuk CSP: cerceveleme (clickjacking), <base> ve eklenti yasak; hicbir kaynagi kisitlamaz.
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

# Tam CSP RAPOR kipinde (K175): ihlal tarayici konsoluna yazilir, hicbir sey engellenmez.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://media.davetkart.com; media-src 'self' blob: https://media.davetkart.com; connect-src 'self'; frame-src https://www.openstreetmap.org; object-src 'none'; base-uri 'self'; form-action 'self' https://www.shopier.com" always;
