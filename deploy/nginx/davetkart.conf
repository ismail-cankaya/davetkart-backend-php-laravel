# DavetKart — Nginx (Lightsail, Ubuntu 24.04). Ayrinti: docs/rehber/deploy/nginx/davetkart.md
# Yerlesim: /var/www/davetkart/backend (Laravel) + /var/www/davetkart/frontend/dist (SPA)
# certbot (Y7.2) bu dosyaya 443/ssl ve http->https yonlendirmesini ekler.
# HSTS'yi Nginx BASMAZ: Laravel SecurityHeaders basar (Y7.4).

# Bilinmeyen Host / dogrudan IP istegi: yanit vermeden baglantiyi kes.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# www -> apex. 'location' icinde: certbot dogrulama bloğunu buraya ekleyebilsin.
server {
    listen 80;
    listen [::]:80;
    server_name www.davetkart.com;

    location / {
        return 301 https://davetkart.com$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name davetkart.com;

    root /var/www/davetkart/frontend/dist;
    index index.html;

    server_tokens off;
    client_max_body_size 30m;   # varsayilan 1 MB; asilirsa Laravel'e hic ulasmadan 413

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # .env, .git vb. Nokta ile baslayan yollar 404 (SPA geri donusu 200 verirdi).
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # API: ayni alan adi, /api onekini Laravel karsilar.
    location ^~ /api/ {
        root /var/www/davetkart/backend/public;
        try_files $uri /index.php?$query_string;
    }

    # Calistirilabilen TEK php dosyasi. Disaridan dogrudan istenemez (internal).
    location = /index.php {
        internal;
        root /var/www/davetkart/backend/public;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    # Vite ciktisi: dosya adinda hash var, icerik degisince ad degisir -> 1 yil onbellek.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Giris sayfasi her seferinde dogrulanir; yeni deploy'daki hash'li dosyalar boylece bulunur.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
