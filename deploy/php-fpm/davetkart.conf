; DavetKart PHP-FPM havuzu (OPS-07, K269). Ayrinti: docs/rehber/deploy/php-fpm/davetkart.md
; Kurulum: /etc/php/8.5/fpm/pool.d/davetkart.conf; dagitimin www.conf'u devre disi (ayni soket).
; Sinama: sudo php-fpm8.5 -t   Yukleme: sudo systemctl reload php8.5-fpm

[davetkart]
user = www-data
group = www-data

; deploy/nginx/davetkart.conf'taki fastcgi_pass ile AYNI soket.
listen = /run/php/php8.5-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; 2 GB sunucu: 4 x 256M (memory_limit) + kuyruk 768M + PostgreSQL + isletim sistemi. Tablo kilavuzda.
pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
; Sizinti birikmesin: her surec 500 istekten sonra yenilenir.
pm.max_requests = 500

; nginx fastcgi_read_timeout'un en buyugu 60s: nginx'ten once FPM kesmesin, sonra da asili kalmasin.
request_terminate_timeout = 60s
; 5 saniyeyi asan istegin yigini yazilir (OPS-09: yavas istek olcumu).
request_slowlog_timeout = 5s
slowlog = /var/log/php8.5-fpm-davetkart.slow.log

; Yalnizca soketten okunur; nginx bu yollari PHP'ye gecirmez (yalnizca index.php calisir).
pm.status_path = /fpm-status
ping.path = /fpm-ping

catch_workers_output = yes
decorate_workers_output = no
